name: Intercom Queue Report

on:
  schedule:
    # 00:00, 06:00, 14:00 UTC = 03:00, 09:00, 17:00 Israel time (IDT, UTC+3).
    # NOTE: Israel switches to winter time (IST, UTC+2) in late October -
    # these will land an hour earlier local time until the cron is updated
    # for the season.
    - cron: "0 0,6,14 * * *"
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/test_intercom_slack_report.py -v

  report:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run queue report
        env:
          INTERCOM_TOKEN: ${{ secrets.INTERCOM_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.QUEUE_REPORT_SLACK_WEBHOOK_URL }}
          # Optional - omit these secrets entirely if you don't use them;
          # the script skips those sections gracefully.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DAILY_UPDATES_DATA_SOURCE_ID: ${{ secrets.NOTION_DAILY_UPDATES_DATA_SOURCE_ID }}
        run: python intercom_slack_report.py
