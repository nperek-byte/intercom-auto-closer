name: Intercom Queue Report

on:
  schedule:
    # 06:00, 10:00, 14:00, 18:00 UTC. Adjust for your timezone with crontab.guru.
    - cron: "0 6,10,14,18 * * *"
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/test_intercom_slack_report.py -v

  report:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run queue report
        env:
          INTERCOM_TOKEN: ${{ secrets.INTERCOM_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.QUEUE_REPORT_SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DAILY_UPDATES_DATA_SOURCE_ID: ${{ secrets.NOTION_DAILY_UPDATES_DATA_SOURCE_ID }}
        run: python intercom_slack_report.py
