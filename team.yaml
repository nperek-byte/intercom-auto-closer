# Intercom Auto-Closer — team configuration
#
# This file is NOT secret and should be committed to the repo. It's what makes
# this a shared team tool instead of one person's personal script: to onboard
# a new teammate, add an entry below (and add their Slack webhook to the
# SLACK_WEBHOOKS_JSON secret — see README.md).
#
# Anything sensitive (Slack webhook URLs, the Intercom API token) lives in
# GitHub Actions secrets, never in this file.

# Used for every teammate unless they set their own "follow_up_marker" below.
default_follow_up_marker: "I just wanted to follow up in case you missed my previous message"

# Used for every teammate unless they set their own "closing_message" below.
# {name} and {team} are filled in from each teammate's entry.
default_closing_message_template: |
  Hi,

  I'm glad I was able to help get everything sorted out for you. Before I close the conversation, I wanted to let you know that you'll receive a short CSAT survey about your experience with the support I provided. If you have a moment to share your feedback, I'd really appreciate hearing about your experience. Thanks again for your patience and for working through this with me. If you ever need help with anything else, please don't hesitate to reach out!
  Have a great day!

  Best,
  {name}
  {team}

teammates:
  - key: nitzan
    name: Nitzan
    team: Figma Weave Support
    # Find this with: python intercom_auto_closer.py --list-admins
    admin_id: "REPLACE_WITH_YOUR_INTERCOM_ADMIN_ID"

    # Uncomment either of these to override the shared default for just this person:
    # follow_up_marker: "some other distinctive phrase"
    # closing_message: |
    #   A fully custom closing message, if the shared template doesn't fit.

  # - key: dana
  #   name: Dana
  #   team: Figma Weave Support
  #   admin_id: "1234567"
